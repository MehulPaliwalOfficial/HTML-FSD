<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>
    <FORM action="/Day 7/page.html" method="POST">
        <label for="Name">Name:</label>
        <input type="text" placeholder="Enter your Name" name="Name" value="Mehul" id="Name" maxlength="100">
        <br>
        <label for="Age">Age:</label>
        <input type="number" placeholder="Enter your Age" name="Age" id="Age" min="0" max="100">
        <br>
        <label for="Gender">Gender:</label>
        <input type="radio" name="Gender" id="Male">
        <label for="Male">Male</label>
        <input type="radio" name="Gender" id="Female">
        <label for="Female">Female</label>
        <br>
        <label for="DOB">DOB</label>
        <input type="date" placeholder="DOB" name="DOB" id="DOB" value="2008/05/12">
        <br>
        <label for="Mail">Email:</label>
        <input type="email" placeholder="you@example.com" name="Mail" id="Mail" value="mehul@gmail.com" required>
        <br>
        <label for="Password">Password</label>
        <input type="password" placeholder="Enter your Password" name="Password" id="Password">
        <br>
        <input type="checkbox" name="RememberMe" id="RememberMe">
        <br>
        <!-- <input type="submit" value="Sign In">
        <input type="reset" value="Reset"> -->
        <button type="submit">Sign In</button>
        <button type="reset">Reset</button>
    </FORM>
</body>
</html>
